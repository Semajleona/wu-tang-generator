<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=initial-scale=1.0">

</head>

<body>

    <h1> Name Generator</h1>
    <img src="WuTang2025_1248x680-9d02059e97.jpg.webp">
    <span class="question">Pick you alter ego</span>
    <select class="ego">
        <option>Killah</option>
        <option>Gangsta</option>

    </select>


    <span class="question">Pick your color</span>
    <select class="color">
        <option>Red</option>
        <option>Black</option>

    </select>


    <span class="question">Pick your presence</span>
    <select class="presence">

        <option>Ghost</option>
        <option>Shadow</option>

    </select>


    <span class="question">Which word best describes you?</span>
    <select class="persona">

        <option>Rebel</option>
        <option>Master</option>
    </select>


    <span class="question"> Which animal resonates with you ?</span>
    <select class="animal">
        <option>Cobra</option>

        <option>Dragon</option>

    </select>

    <button>My Wu-Tang Name</button>
    <h2></h2>
    <script src="main.js"></script>
</body>

</html>
